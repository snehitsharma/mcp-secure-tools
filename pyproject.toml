[project]
name = "auth-service"
version = "0.1.0"
description = "Caller verification for voice and chat AI agents, as an MCP tool. Identity never passes through the model."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
