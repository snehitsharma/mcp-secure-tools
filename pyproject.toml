[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-secure-tools"
version = "0.1.0"
description = "MCP tools for voice and chat AI agents where identity never passes through the model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "snehitsharma" }]
requires-python = ">=3.12"
keywords = ["mcp", "ai-agents", "voice-ai", "verification", "security", "jwt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/snehitsharma/mcp-secure-tools"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_secure_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 125
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B904"]  # gate deliberately re-raises as a contract error without chaining
